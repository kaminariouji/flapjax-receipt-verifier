name: verify

on:
  push:
  pull_request:
  schedule:
    # 06:10 UTC daily — after the buyback window, so the newest receipt is old
    # enough to have a confirmed block.
    - cron: '10 6 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify every receipt against BNB Chain
        run: node verify-all.mjs
      - name: Assert known-good buybacks (tamper test included)
        run: node selftest.mjs
